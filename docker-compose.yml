version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: beesmart_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./server
    container_name: beesmart_backend
    command: sh -c "node seed.js && node server.js"
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/beesmart
      - JWT_SECRET=your_super_secret_key_here
      - PORT=5000
      - FRONTEND_URL=http://localhost
    depends_on:
      - mongodb

  frontend:
    build: ./client
    container_name: beesmart_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
